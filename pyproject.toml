[project]
name = "jsintel"
version = "0.1.0"
description = "JavaScript intelligence engine for bug bounty — extracts secrets, endpoints & parameters from JS bundles."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "nadirzhon" }]
keywords = ["bug-bounty", "javascript", "secrets", "recon", "security", "appsec", "osint"]
classifiers = ["License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Security"]
dependencies = ["aiohttp>=3.9"]

[project.scripts]
jsintel = "jsintel_cli:main"

[project.urls]
Homepage = "https://github.com/nadirzhon/jsintel"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"analyzer.py" = "jsintel_cli.py"
